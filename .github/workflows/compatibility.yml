name: Compatibility evidence
on:
  workflow_dispatch:
  push:
    branches: ['compat/beta11-cross-platform-20261031']
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Host ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        node: ['22.19.0', '24']
        host: ['0.2.1-rc.2', '0.2.1-rc.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Verify checkout bytes against Git objects
        shell: bash
        run: |
          git ls-tree -rz HEAD | while IFS=$'\t' read -r -d '' meta file; do
            expected="${meta##* }"
            actual="$(git hash-object --no-filters -- "$file")"
            test "$actual" = "$expected" || { echo CHECKOUT_BYTE_MISMATCH; exit 1; }
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - name: Run isolated exact-SDK proof
        shell: bash
        env:
          DOCTOR_HOST_VERSION: ${{ matrix.host }}
        run: node ci/compatibility.mjs --host "$DOCTOR_HOST_VERSION" --output "$RUNNER_TEMP/doctor-summary"
      - name: Upload allowlisted sanitized summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.host }}
          path: ${{ runner.temp }}/doctor-summary/summary.json
          if-no-files-found: error
          retention-days: 7
